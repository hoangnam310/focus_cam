[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "focus-cam"
version = "0.1.0"
description = "Manually select any tracked performer and render a smooth focus cam."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "flask>=3.1,<4",
  "lap>=0.5.12,<1",
  "numpy>=1.26,<3",
  "opencv-python>=4.10,<5",
  "ultralytics>=8.3,<9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
focus-cam = "focuscam.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/focuscam"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
